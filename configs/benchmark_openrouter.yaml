# One reproducible benchmark run: a registry of LLM+harness profiles, a registry of benchmarks,
# and the names selected from each. Override benchmark/profile/output from the command line.

defaults:
  - configs/models/openrouter.yaml

model:
  max_tokens: 256

agent:
  system_prompt: Answer the benchmark task directly and follow its requested output format.
  max_steps: 2
  cost_limit: null
  token_limit: 4096
  context_window: null
  hooks: []
  skills: null
  context_files: []
  events: null

tools: []
tools_dir: null
allowed_tools: []

profiles:
  native-openrouter:
    label: DeepSeek V4 Flash · NanoAgent
    model: deepseek/deepseek-v4-flash-0731
    harness: {type: native, command: null, cwd: null, options: {}}
    model_overrides: {}

benchmarks:
  arithmetic-example:
    label: Arithmetic example
    version: "1"
    primary_metric: accuracy
    adapter:
      type: jsonl_exact_match
      code: null
      options:
        path: benchmarks/examples/arithmetic.jsonl
        strip: true
        casefold: false

profile: native-openrouter
benchmark: arithmetic-example
output: expdir/benchmarks/arithmetic-example/native-openrouter
concurrency: 2
filter: ""
slice: ""
shuffle: false
redo: false
timeout: 120.0
